# Maps the client's Upgrade header to the right Connection value: "upgrade" for
# the WebSocket handshake, "close" for ordinary requests. Without it,
# $connection_upgrade is empty and the /api/ws upgrade silently fails.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API and WebSocket, same origin as the web app so it needs no CORS.
    #
    # The upstream goes through a variable on purpose: a literal
    # `proxy_pass http://backend:8000/api/` is resolved when the config is
    # parsed, so nginx refuses to start ("host not found in upstream") whenever
    # this image runs without a `backend` container next to it — which is the
    # case for the standalone deploy, where the app talks to an absolute
    # VITE_API_URL and never uses this proxy at all. With a variable the name is
    # only looked up when a request actually arrives.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_origin "http://backend:8000";

    location /api/ {
        proxy_pass $backend_origin/api/;
        proxy_http_version 1.1;

        # Required for the /api/ws live feed to upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live feed is long-lived; do not cut it off after the default 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vue Router uses history mode: unknown paths must serve the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
