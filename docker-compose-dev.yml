services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-popote}
    ports:
      # Web UI at http://localhost:8529 (user root).
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    healthcheck:
      # arangosh always authenticates, so the endpoint and credentials have to
      # be passed explicitly or every probe fails with "not connected".
      test: ["CMD", "arangosh",
             "--server.endpoint", "tcp://127.0.0.1:8529",
             "--server.username", "root",
             "--server.password", "${ARANGO_ROOT_PASSWORD:-popote}",
             "--javascript.execute-string", "db._version()"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-popote}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-popote1234}
    ports:
      # S3 API at 9000, web console at http://localhost:9001.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  arango_data:
  arango_apps:
  minio_data:
