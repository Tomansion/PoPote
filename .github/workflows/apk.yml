name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL to bake into the APK'
        required: false
        default: 'https://everymeal-back.tomansion.fr/api'

# The APK is a plain build artifact; only the release step writes anything.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8's Gradle build needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          # Passed via the environment rather than interpolated into the script,
          # and only exported when actually set: an empty VITE_API_URL would
          # take priority over .env.apk and silently produce an APK that calls a
          # relative /api path, which resolves to nothing inside the WebView.
          API_URL_INPUT: ${{ github.event.inputs.api_url }}
        run: |
          if [ -n "$API_URL_INPUT" ]; then
            export VITE_API_URL="$API_URL_INPUT"
            echo "Backend URL (override): $VITE_API_URL"
          else
            echo "Backend URL (from .env.apk):"
            grep VITE_API_URL .env.apk
          fi
          npm run build:apk

      - name: Verify the backend URL was baked in
        run: |
          if ! grep -rqE 'https?://[^"]+/api' dist/assets/*.js; then
            echo "::error::No absolute API URL found in the bundle; the APK would not reach any backend."
            exit 1
          fi
          echo "Absolute API URL found in the bundle."

      # The android/ directory is generated rather than committed, so the repo
      # stays free of the Gradle project and it is always regenerated from the
      # Capacitor version in package.json.
      - name: Generate the Android project
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/everymeal-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -lh out/

      # Downloadable from the workflow run's "Artifacts" section for 90 days.
      - uses: actions/upload-artifact@v4
        with:
          name: everymeal-apk
          path: frontend/out/*.apk
          retention-days: 90
          if-no-files-found: error

      # Tagging (e.g. `git tag v0.1.0 && git push --tags`) publishes a release
      # with a stable download link, which is easier to share than an artifact.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/out/*.apk
          generate_release_notes: true
