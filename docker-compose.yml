services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-popote}
    ports:
      # Web UI at http://localhost:8529 (user root).
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    healthcheck:
      # arangosh always authenticates, so the endpoint and credentials have to
      # be passed explicitly or every probe fails with "not connected".
      test: ["CMD", "arangosh",
             "--server.endpoint", "tcp://127.0.0.1:8529",
             "--server.username", "root",
             "--server.password", "${ARANGO_ROOT_PASSWORD:-popote}",
             "--javascript.execute-string", "db._version()"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # SECURITY: these defaults are public and well-known — override via a
      # .env next to this file before exposing the listener beyond localhost.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-popote}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-popote1234}
    ports:
      # S3 API at 9000, web console at http://localhost:9001.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Defaults target the local Arango container. To point the stack at the
      # shared instance instead, set these in a .env next to this file.
      ARANGO_URL: ${ARANGO_URL:-http://arangodb:8529}
      ARANGO_DB: ${ARANGO_DB:-popote}
      ARANGO_USER: ${ARANGO_USER:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-popote}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Optional. Left empty, the backend generates a key on first start and
      # keeps it in ArangoDB, so sessions survive restarts with no config.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_DAYS: ${JWT_TTL_DAYS:-3650}
      # AI recipe/image generation. Left empty, both features are simply
      # disabled — this whole area is optional flavor on top of the core CRUD.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      # Where generated recipe images are stored.
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-popote}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-popote1234}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-popote-recipes}
      # What the *browser* can reach — different from RUSTFS_ENDPOINT whenever
      # that one is an internal container hostname, as it is by default here.
      RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      arangodb:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  arango_data:
  arango_apps:
  rustfs_data:
