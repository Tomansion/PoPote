services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-everymeal}
    ports:
      # Web UI at http://localhost:8529 (user root).
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    healthcheck:
      # arangosh always authenticates, so the endpoint and credentials have to
      # be passed explicitly or every probe fails with "not connected".
      test: ["CMD", "arangosh",
             "--server.endpoint", "tcp://127.0.0.1:8529",
             "--server.username", "root",
             "--server.password", "${ARANGO_ROOT_PASSWORD:-everymeal}",
             "--javascript.execute-string", "db._version()"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    environment:
      # Defaults target the local Arango container. To point the stack at the
      # shared instance instead, set these in a .env next to this file.
      ARANGO_URL: ${ARANGO_URL:-http://arangodb:8529}
      ARANGO_DB: ${ARANGO_DB:-everymeal}
      ARANGO_USER: ${ARANGO_USER:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-everymeal}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      arangodb:
        condition: service_healthy
    ports:
      # Exposed for direct access / API docs at http://localhost:8100/docs.
      # 8100 rather than 8000, which is often already in use.
      - "8100:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  arango_data:
  arango_apps:
